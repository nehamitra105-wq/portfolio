<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neha Mitra - Portfolio</title>
    <meta name="description" content="I'm Neha Mitra, a truly curious product designer that always delivers, one detail at a time.">

    <!-- Social Share & Search Preview Tags -->
    <meta property="og:title" content="Neha Mitra - Portfolio">
    <meta property="og:description" content="I'm Neha Mitra, a truly curious product designer that always delivers, one detail at a time.">
    <meta property="og:url" content="https://www.nehamitra.com">
    <meta property="og:type" content="website">
    <!-- The picture attached when the link is shared: the loading screen. -->
    <meta property="og:image" content="https://www.nehamitra.com/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://www.nehamitra.com/og-image.png">
    
    <!-- Tab icon: the black logo on light browser tabs, the white one on dark. -->
    <link rel="icon" type="image/png" href="/logo-black.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" href="/logo.png" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/logo-black.png" />
    
    <!-- The loading screen's own pictures come first, so it's ready to show. -->
    <link rel="preload" as="image" href="/assets/loader/cd-glare.png" fetchpriority="high" />
    <link rel="preload" as="image" href="/assets/loader/star.svg" />
    <link rel="preload" as="image" href="/assets/loader/star-glow.svg" />
    
    
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
