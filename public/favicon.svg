<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 113 113" width="113" height="113">
  <!-- Black logo on light themes, white on dark; the background stays clear. -->
  <style>
    .dark { display: none; }
    @media (prefers-color-scheme: dark) {
      .light { display: none; }
      .dark { display: inline; }
    }
  </style>
  <image class="light" x="0" y="1" width="113" height="111" href="data:image/png;base64,"/>
  <image class="dark" x="0" y="1" width="113" height="111" href="data:image/png;base64,"/>
</svg>
